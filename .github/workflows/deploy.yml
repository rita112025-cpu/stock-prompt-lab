name: Deploy Vite site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # 擋下寫死的持股、代號清單與被提交的 CSV；未通過就不會部署。
      # 可在 Settings → Secrets and variables → Actions 新增 PRIVACY_DENYLIST（帳戶名、股票名稱，逗號分隔）。
      - name: Privacy check
        run: npm run privacy-check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        id: e2e
        run: npm run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            screenshots/playwright-report/
            screenshots/browser-tests/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
